# WeasyPrint needs these native libraries at runtime. Installing them via apt
# (instead of nix) puts them in the standard system path + ldconfig cache so
# Python's ctypes.util.find_library('gobject-2.0') can locate them.
# fonts-noto-core / fonts-dejavu-core give proper Arabic + Latin glyphs in the PDF.
[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libpangoft2-1.0-0",
  "libcairo2",
  "libharfbuzz0b",
  "libfribidi0",
  "libfontconfig1",
  "fonts-noto-core",
  "fonts-dejavu-core"
]
